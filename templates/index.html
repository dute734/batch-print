<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel 批量打印 · WPS 版</title>
<style>
:root{
  --ink:#2c2a3a; --ink-2:#615d78; --ink-3:#8b87a3;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.75); --stroke:rgba(120,110,160,.16);
  --pink:#f7a8c4; --purple:#b79df0; --blue:#8fc7f2;
  --ok:#39b98a; --warn:#e9a13b; --bad:#e2606a;
  --r-lg:22px; --r-md:14px;
  --sh:0 18px 50px rgba(108,92,150,.16), 0 2px 8px rgba(108,92,150,.08);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-size:14px; line-height:1.55;
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1200px 700px at 8% -10%, rgba(247,168,196,.55), transparent 60%),
    radial-gradient(900px 620px at 92% 4%, rgba(143,199,242,.5), transparent 62%),
    radial-gradient(1100px 800px at 55% 108%, rgba(183,157,240,.46), transparent 60%),
    linear-gradient(160deg,#fdfbff 0%,#f6f2fd 42%,#eef4fd 100%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:26px 26px 30px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  background:linear-gradient(145deg,var(--pink),var(--purple) 55%,var(--blue));
  box-shadow:0 10px 24px rgba(183,157,240,.45), inset 0 1px 0 rgba(255,255,255,.85);}
h1{font-size:19px;margin:0;letter-spacing:.4px}
.sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:var(--glass-2);border:1px solid var(--line);backdrop-filter:blur(16px);
  font-size:12px;color:var(--ink-2);box-shadow:var(--sh)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(57,185,138,.18)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(233,161,59,.18)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(226,96,106,.18)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:var(--sh);padding:18px 20px;margin-bottom:18px}
.card h2{font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:9px;font-weight:650}
.card h2 .tag{font-size:11px;color:var(--ink-3);font-weight:500;padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.6);border:1px solid var(--stroke)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:12px;padding:9px 16px;background:rgba(255,255,255,.72);
  color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(120,105,165,.10);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s,background .16s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(120,105,165,.18)}
button:active{transform:translateY(1px) scale(.99)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
button.primary{background:linear-gradient(135deg,#ff9fc4 0%,#b79df0 55%,#8fc7f2 100%);
  color:#fff;font-weight:650;border:none;box-shadow:0 12px 26px rgba(183,157,240,.4),inset 0 1px 0 rgba(255,255,255,.5)}
button.primary:hover{box-shadow:0 16px 32px rgba(183,157,240,.5)}
button.ghost{background:rgba(255,255,255,.4)}
button.danger{color:#b93a45}
button.mini{padding:5px 10px;font-size:12px;border-radius:9px}
input[type=number],select{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.85);color:var(--ink);outline:none}
input[type=number]{width:64px;text-align:center}
input[type=number]:focus,select:focus{border-color:rgba(183,157,240,.6);box-shadow:0 0 0 3px rgba(183,157,240,.16)}
select.sel-printer{min-width:300px;max-width:440px}
.check{width:16px;height:16px;accent-color:#b79df0;cursor:pointer}
.drop{border:1.5px dashed rgba(183,157,240,.55);border-radius:var(--r-lg);padding:22px;text-align:center;
  color:var(--ink-2);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.28));transition:.2s}
.drop.hot{border-color:#b79df0;background:rgba(255,255,255,.75);transform:scale(1.01)}
.drop b{color:var(--ink)}
.mini-note{font-size:12px;color:var(--ink-3)}
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.file{display:grid;grid-template-columns:26px 22px 1fr auto auto;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-md);background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(120,105,165,.06);transition:.18s;cursor:pointer}
.file:hover{background:rgba(255,255,255,.8);transform:translateY(-1px);box-shadow:0 8px 22px rgba(120,105,165,.13)}
.file.active{border-color:rgba(183,157,240,.65);background:rgba(255,255,255,.87);box-shadow:0 8px 24px rgba(183,157,240,.22)}
.file.dragging{opacity:.45}
.file .idx{font-size:11px;color:#fff;width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--pink),var(--purple));box-shadow:0 4px 10px rgba(183,157,240,.3)}
.file .grab{color:#b2adc4;cursor:grab;text-align:center;font-size:13px}
.file .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.file .ops{display:flex;gap:6px}
.sheet-groups{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.sgroup{border-radius:var(--r-md);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);overflow:hidden}
.sgroup .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(90deg,rgba(247,168,196,.22),rgba(183,157,240,.18),rgba(143,199,242,.16));
  border-bottom:1px solid rgba(255,255,255,.7)}
.sgroup .hd .nm{font-weight:650;font-size:13px}
.sheet{display:grid;grid-template-columns:22px 1.6fr .7fr .9fr 1fr 1.15fr;gap:8px;align-items:center;
  padding:9px 14px;border-bottom:1px solid rgba(120,110,160,.07);font-size:12.5px}
.sheet:last-child{border-bottom:none}
.sheet.head{color:var(--ink-3);font-size:11.5px;font-weight:600;background:rgba(255,255,255,.35)}
.sheet.off{opacity:.5}
.sheet .snm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.65);
  border:1px solid var(--stroke);color:var(--ink-2);display:inline-block}
.pill.hid{background:rgba(233,161,59,.14);border-color:rgba(233,161,59,.3);color:#95601a}
.pill.empty{background:rgba(139,135,163,.12);color:var(--ink-3)}
.pill.st-ok{background:rgba(57,185,138,.15);color:#1f7a5b;border-color:rgba(57,185,138,.3)}
.pill.st-fail{background:rgba(226,96,106,.15);color:#a8323b;border-color:rgba(226,96,106,.3)}
.pill.st-printing{background:rgba(143,199,242,.2);color:#2c6b99;border-color:rgba(143,199,242,.4)}
.pill.st-unknown{background:rgba(139,135,163,.14);color:var(--ink-2)}
.summary{position:sticky;bottom:16px;z-index:3;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(28px) saturate(190%);box-shadow:0 16px 44px rgba(108,92,150,.2);padding:14px 20px;margin-top:8px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-size:17px;letter-spacing:.3px}
.stat span{font-size:11px;color:var(--ink-3)}
.prog-rows{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto;margin-top:8px}
.prow{display:grid;grid-template-columns:32px 1.4fr 1fr 64px 100px;gap:8px;align-items:center;
  font-size:12.5px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.5)}
.prow .no{color:var(--ink-3);font-size:11px}
.prow .nt{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logbox{max-height:220px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;
  color:var(--ink-2);background:rgba(255,255,255,.45);border-radius:12px;padding:10px 12px;margin-top:8px;
  white-space:pre-wrap;word-break:break-all}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13px}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(183,157,240,.35);border-top-color:#b79df0;
  display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(183,157,240,.35);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">印</div>
      <div>
        <h1>Excel 批量打印</h1>
        <div class="sub">接入本机 WPS 表格 · 按工作表选打 · 全程本机处理</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="badge" id="wpsBadge"><span class="dot" id="wpsDot"></span><span id="wpsText">正在检测 WPS…</span></div>
  </div>

  <div class="card">
    <h2>打印机 <span class="tag" id="printerState">未选择</span></h2>
    <div class="row">
      <select class="sel-printer" id="printerSelect" onchange="onPrinterChange()"></select>
      <button class="ghost" onclick="loadPrinters()">刷新</button>
      <span class="mini-note" id="printerHint">带「虚拟」标记的打印机会弹「另存为」，不适合批量打印。</span>
    </div>
  </div>

  <div class="card">
    <h2>1 · 导入 Excel <span class="tag" id="fileCount">0 个文件</span></h2>
    <div class="drop" id="drop">
      <div style="font-size:15px;margin-bottom:4px"><b>把 Excel 文件拖到这里</b></div>
      <div class="mini-note">支持 .xlsx / .xls / .xlsm / .xlsb，可一次拖多个，导入后可上下调顺序</div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button onclick="event.stopPropagation();pickFiles()">选择文件</button>
        <button onclick="event.stopPropagation();pickFolder()">选择文件夹</button>
      </div>
    </div>
    <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.xlsm,.xlsb" class="hide">
    <div class="file-list" id="fileList"></div>
  </div>

  <div class="card">
    <h2>2 · 确认工作表 <span class="tag" id="sheetCount">0 个工作表</span></h2>
    <div class="row" style="margin-bottom:12px">
      <span class="mini-note">统一份数</span>
      <input type="number" id="globalCopies" value="1" min="1" max="99">
      <button class="mini ghost" onclick="applyAll('copies')">应用到全部</button>
      <span class="mini-note" style="margin-left:8px">统一方向</span>
      <select id="globalOrient">
        <option value="keep">保持原方向</option>
        <option value="landscape">全部横向</option>
        <option value="portrait">全部纵向</option>
        <option value="fitwidth">适应一页宽</option>
      </select>
      <button class="mini ghost" onclick="applyAll('orient')">应用到全部</button>
      <button class="mini ghost" onclick="toggleAll(true)">全选</button>
      <button class="mini ghost" onclick="toggleAll(false)">全不选</button>
    </div>
    <div class="sheet-groups" id="sheetGroups">
      <div class="empty">导入文件后，这里会列出每个 Excel 里的工作表、页数、原方向和是否打印</div>
    </div>
  </div>

  <div class="card hide" id="progressCard">
    <h2>3 · 打印进度 <span class="tag" id="progState">准备中</span></h2>
    <div class="prog-rows" id="progRows"></div>
    <div class="logbox" id="logBox"></div>
  </div>

  <div class="summary">
    <div class="stat"><b id="sumSheets">0</b><span>已勾选工作表</span></div>
    <div class="stat"><b id="sumCopies">0</b><span>总份数</span></div>
    <div class="stat"><b id="sumPages">0</b><span>预计页数</span></div>
    <div class="spacer"></div>
    <button id="stopBtn" class="danger hide" onclick="stopPrint()">中止打印</button>
    <button id="printBtn" class="primary" onclick="startPrint()">开始打印</button>
  </div>
</div>

<script>
const S = {
  files: [],
  printers: [],
  settings: {},      // {fileId: {sheetName: {print, copies, orientation}}}
  activeId: null,
  running: false,
  pollTimer: null,
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok && j.error) throw new Error(j.error);
  return j;
}

/* ---------------- 初始化 ---------------- */
async function boot() {
  const j = await api('/api/init');
  S.files = j.files || [];
  S.printers = j.printers || [];
  renderPrinters(j.printers || []);
  renderWps(j.wps);
  renderAll();
}

function renderWps(w) {
  const t = $('wpsText'), d = $('wpsDot');
  if (!w) { t.textContent = '未检测到 WPS'; d.className = 'dot bad'; return; }
  const ver = w.file_version || w.version || '';
  const inner = w.product_version || '';
  t.textContent = '本机 WPS ' + ver + (inner && inner !== ver ? '（内部 ' + inner + '）' : '');
  d.className = 'dot';
}

function renderPrinters(list) {
  const sel = $('printerSelect');
  const cur = sel.value;
  sel.innerHTML = '';
  if (!list.length) {
    sel.innerHTML = '<option value="">未找到打印机</option>';
  } else {
    list.forEach(p => {
      const o = document.createElement('option');
      o.value = p.name;
      o.textContent = p.name + (p.virtual ? '  · 虚拟' : '') + (p.status_text && p.status_text !== '就绪' ? '  · ' + p.status_text : '');
      if (p.is_default) o.selected = true;
      sel.appendChild(o);
    });
  }
  if (cur) sel.value = cur;
  onPrinterChange();
}

function onPrinterChange() {
  const name = $('printerSelect').value;
  const p = S.printers.find(x => x.name === name);
  const st = $('printerState');
  if (!p) { st.textContent = '未选择'; return; }
  st.textContent = p.virtual ? '虚拟打印机（会弹另存为）' : (p.status_text || '就绪');
  $('printerHint').textContent = p.virtual
    ? '这是虚拟打印机，批量打印会逐个弹出「另存为」窗口，建议换成真实打印机。'
    : '打印机名称格式已在后端按 WPS 要求处理（打印机名 在 NeXX:）。';
}

async function loadPrinters() {
  const j = await api('/api/printers');
  S.printers = j.printers || [];
  renderPrinters(S.printers);
}

/* ---------------- 导入 ---------------- */
function pickFiles() { $('fileInput').click(); }

$('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const fd = new FormData();
  files.forEach(f => fd.append('files[]', f));
  $('fileCount').textContent = '上传中…';
  const r = await fetch('/api/upload', {method: 'POST', body: fd});
  const j = await r.json();
  e.target.value = '';
  await afterAdd(j);
});

async function pickFolder() {
  const j = await api('/api/pick', {mode: 'folder'});
  await afterAdd(j);
}

async function afterAdd(j) {
  S.files = j.files || S.files;
  renderAll();
  const ids = j.added || [];
  if (ids.length) await inspectFiles(ids);
}

async function inspectFiles(ids) {
  $('fileCount').textContent = '读取工作表中…';
  try {
    const j = await api('/api/inspect', {ids});
    S.files = j.files || S.files;
    seedSettings();
    renderAll();
  } catch (e) {
    alert('读取工作表失败：' + e.message);
  }
}

function seedSettings() {
  S.files.forEach(f => {
    if (!S.settings[f.id]) S.settings[f.id] = {};
    (f.sheets || []).forEach(sh => {
      if (!S.settings[f.id][sh.name]) {
        S.settings[f.id][sh.name] = {
          print: sh.visible === '可见',
          copies: 1,
          orientation: 'keep',
        };
      }
    });
  });
}

/* ---------------- 渲染文件列表 ---------------- */
function renderAll() {
  renderFiles();
  renderSheets();
  updateSummary();
  $('fileCount').textContent = S.files.length + ' 个文件';
}

function renderFiles() {
  const box = $('fileList');
  if (!S.files.length) { box.innerHTML = ''; return; }
  box.innerHTML = S.files.map((f, i) => {
    const sheets = f.sheets || [];
    const chosen = sheets.filter(s => (S.settings[f.id]?.[s.name]?.print)).length;
    let meta = '';
    if (!f.inspected) meta = '<span class="spin"></span>正在读取工作表…';
    else if (f.error) meta = '读取失败：' + esc(f.error);
    else meta = sheets.length + ' 个工作表 · 已选 ' + chosen + ' 个' + (f.chart_sheets ? ' · 另有 ' + f.chart_sheets + ' 个图表页（不参与打印）' : '');
    return `<div class="file ${S.activeId === f.id ? 'active' : ''}" draggable="true" data-id="${f.id}">
      <div class="idx">${i + 1}</div>
      <div class="grab">⠿</div>
      <div>
        <div class="nm" title="${esc(f.path)}">${esc(f.name)}</div>
        <div class="meta">${meta}</div>
      </div>
      <div class="ops">
        <button class="mini ghost" onclick="event.stopPropagation();move('${f.id}',-1)">↑</button>
        <button class="mini ghost" onclick="event.stopPropagation();move('${f.id}',1)">↓</button>
      </div>
      <div class="ops">
        <button class="mini danger" onclick="event.stopPropagation();removeFile('${f.id}')">移除</button>
      </div>
    </div>`;
  }).join('');
  bindDrag();
}

function renderSheets() {
  const box = $('sheetGroups');
  const ready = S.files.filter(f => f.inspected && !f.error && (f.sheets || []).length);
  if (!ready.length) {
    box.innerHTML = '<div class="empty">导入文件后，这里会列出每个 Excel 里的工作表、页数、原方向和是否打印</div>';
    $('sheetCount').textContent = '0 个工作表';
    return;
  }
  let total = 0;
  box.innerHTML = ready.map(f => {
    total += (f.sheets || []).length;
    const rows = (f.sheets || []).map(sh => {
      const st = S.settings[f.id]?.[sh.name] || {print: false, copies: 1, orientation: 'keep'};
      const hidden = sh.visible !== '可见';
      const note = sh.note && sh.note !== '空白表' ? sh.note : '';
      return `<div class="sheet ${st.print ? '' : 'off'}" data-f="${f.id}" data-s="${esc(sh.name)}">
        <input class="check" type="checkbox" ${st.print ? 'checked' : ''} onchange="setSheet('${f.id}','${esc(sh.name)}','print',this.checked)">
        <div class="snm" title="${esc(sh.name)}">${esc(sh.name)}${note ? ' <span class="pill empty">' + esc(note) + '</span>' : ''}</div>
        <div>${sh.pages == null ? '—' : sh.pages + ' 页'}</div>
        <div><span class="pill ${hidden ? 'hid' : ''}">${hidden ? esc(sh.visible) : '可见'}</span></div>
        <div><span class="pill">原 ${esc(sh.orientation)}</span></div>
        <div class="row" style="gap:6px">
          <input type="number" min="1" max="99" value="${st.copies}" onchange="setSheet('${f.id}','${esc(sh.name)}','copies',this.value)">
          <select onchange="setSheet('${f.id}','${esc(sh.name)}','orientation',this.value)">
            ${orientOptions(st.orientation)}
          </select>
        </div>
      </div>`;
    }).join('');
    const chosen = (f.sheets || []).filter(s => S.settings[f.id]?.[s.name]?.print).length;
    return `<div class="sgroup">
      <div class="hd">
        <span class="nm">${esc(f.name)}</span>
        <span class="pill">${(f.sheets || []).length} 个工作表</span>
        <span class="pill">已选 ${chosen}</span>
        <span class="spacer"></span>
        <button class="mini ghost" onclick="fileAll('${f.id}',true)">本文件全选</button>
        <button class="mini ghost" onclick="fileAll('${f.id}',false)">本文件全不选</button>
      </div>
      <div class="sheet head"><div></div><div>工作表</div><div>页数</div><div>状态</div><div>原方向</div><div>份数 / 方向</div></div>
      ${rows}
    </div>`;
  }).join('');
  $('sheetCount').textContent = total + ' 个工作表';
}

function orientOptions(cur) {
  const opts = [['keep', '保持原样'], ['landscape', '横向'], ['portrait', '纵向'], ['fitwidth', '适应一页宽']];
  return opts.map(([v, t]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${t}</option>`).join('');
}

/* ---------------- 参数设置 ---------------- */
function setSheet(fid, sheet, key, value) {
  if (!S.settings[fid]) S.settings[fid] = {};
  if (!S.settings[fid][sheet]) S.settings[fid][sheet] = {print: true, copies: 1, orientation: 'keep'};
  if (key === 'copies') value = Math.max(1, Math.min(99, parseInt(value || 1)));
  S.settings[fid][sheet][key] = value;
  renderFiles(); renderSheets(); updateSummary();
}

function fileAll(fid, on) {
  (S.files.find(f => f.id === fid)?.sheets || []).forEach(sh => setSheet(fid, sh.name, 'print', on));
}

function toggleAll(on) {
  S.files.forEach(f => (f.sheets || []).forEach(sh => setSheet(f.id, sh.name, 'print', on)));
}

function applyAll(kind) {
  const copies = Math.max(1, parseInt($('globalCopies').value || 1));
  const orient = $('globalOrient').value;
  S.files.forEach(f => (f.sheets || []).forEach(sh => {
    if (!S.settings[f.id]?.[sh.name]) return;
    if (kind === 'copies') S.settings[f.id][sh.name].copies = copies;
    else S.settings[f.id][sh.name].orientation = orient;
  }));
  renderSheets(); updateSummary();
}

function updateSummary() {
  let sheets = 0, copies = 0, pages = 0;
  S.files.forEach(f => (f.sheets || []).forEach(sh => {
    const st = S.settings[f.id]?.[sh.name];
    if (!st || !st.print) return;
    sheets += 1;
    copies += st.copies;
    pages += (sh.pages || 0) * st.copies;
  }));
  $('sumSheets').textContent = sheets;
  $('sumCopies').textContent = copies;
  $('sumPages').textContent = pages || '—';
  $('sheetCount').textContent = S.files.reduce((a, f) => a + (f.sheets || []).length, 0) + ' 个工作表';
}

/* ---------------- 排序 / 删除 ---------------- */
function move(id, dir) {
  const i = S.files.findIndex(f => f.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= S.files.length) return;
  const arr = S.files.slice();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  S.files = arr;
  persistOrder();
  renderFiles();
}

async function persistOrder() {
  await api('/api/order', {ids: S.files.map(f => f.id)});
}

async function removeFile(id) {
  const j = await api('/api/remove', {ids: [id]});
  S.files = j.files || [];
  delete S.settings[id];
  renderAll();
}

let dragId = null;
function bindDrag() {
  document.querySelectorAll('.file').forEach(el => {
    el.addEventListener('dragstart', () => { dragId = el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); });
    el.addEventListener('dragover', (ev) => { ev.preventDefault(); });
    el.addEventListener('drop', (ev) => {
      ev.preventDefault();
      const target = el.dataset.id;
      if (!dragId || dragId === target) return;
      const from = S.files.findIndex(f => f.id === dragId);
      const to = S.files.findIndex(f => f.id === target);
      const arr = S.files.slice();
      const [item] = arr.splice(from, 1);
      arr.splice(to, 0, item);
      S.files = arr;
      dragId = null;
      persistOrder();
      renderFiles();
    });
    el.addEventListener('click', () => { S.activeId = el.dataset.id; renderFiles(); });
  });
}

/* ---------------- 打印 ---------------- */
function buildItems() {
  const items = [];
  S.files.forEach(f => {
    const sheets = (f.sheets || []).filter(sh => S.settings[f.id]?.[sh.name]?.print);
    if (!sheets.length) return;
    items.push({
      path: f.path,
      sheets: sheets.map(sh => ({
        name: sh.name,
        copies: S.settings[f.id][sh.name].copies || 1,
        orientation: S.settings[f.id][sh.name].orientation || 'keep',
      }))
    });
  });
  return items;
}

async function startPrint() {
  const printer = $('printerSelect').value;
  if (!printer) { alert('请先选择打印机'); return; }
  const items = buildItems();
  if (!items.length) { alert('还没有勾选任何工作表'); return; }
  const total = items.reduce((a, i) => a + i.sheets.length, 0);
  if (!confirm('即将打印 ' + total + ' 个工作表，确认开始？')) return;
  const j = await api('/api/print', {printer, items});
  if (j.error) { alert(j.error); return; }
  S.running = true;
  $('progressCard').classList.remove('hide');
  $('printBtn').disabled = true;
  $('stopBtn').classList.remove('hide');
  startPoll();
}

async function stopPrint() {
  await api('/api/stop', {});
  $('progState').textContent = '正在中止…';
}

function startPoll() {
  if (S.pollTimer) clearInterval(S.pollTimer);
  S.pollTimer = setInterval(pollState, 900);
  pollState();
}

async function pollState() {
  const j = await api('/api/state');
  renderProgress(j);
  if (!j.running) {
    clearInterval(S.pollTimer); S.pollTimer = null;
    S.running = false;
    $('printBtn').disabled = false;
    $('stopBtn').classList.add('hide');
    const s = j.summary || {};
    $('progState').textContent = '完成 ' + (s.done || 0) + ' / 失败 ' + (s.failed || 0);
  }
}

function renderProgress(j) {
  const rows = (j.progress || []);
  const labels = {printing: '打印中', ok: '已提交', fail: '失败', unknown: '状态未知'};
  const cls = {printing: 'st-printing', ok: 'st-ok', fail: 'st-fail', unknown: 'st-unknown'};
  $('progRows').innerHTML = rows.map(r => `<div class="prow">
    <div class="no">${r.seq}</div>
    <div title="${esc(r.file)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.file)}</div>
    <div>${esc(r.sheet)}</div>
    <div>${r.copies} 份</div>
    <div><span class="pill ${cls[r.status] || ''}">${labels[r.status] || r.status}</span>
      <span class="nt" title="${esc(r.note)}">${esc(r.note || '')}</span></div>
  </div>`).join('') || '<div class="empty">等待开始…</div>';
  $('logBox').textContent = (j.logs || []).map(l => '[' + l.t + '] ' + l.msg).join('\n');
  $('logBox').scrollTop = $('logBox').scrollHeight;
}

/* ---------------- 拖拽上传 ---------------- */
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('hot');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('hot');
}));
drop.addEventListener('drop', async (e) => {
  const files = Array.from(e.dataTransfer.files || []).filter(f => /\.(xlsx|xls|xlsm|xlsb)$/i.test(f.name));
  if (!files.length) { alert('请拖入 Excel 文件'); return; }
  const fd = new FormData();
  files.forEach(f => fd.append('files[]', f));
  $('fileCount').textContent = '上传中…';
  const r = await fetch('/api/upload', {method: 'POST', body: fd});
  const j = await r.json();
  await afterAdd(j);
});

boot();
</script>
</body>
</html>
